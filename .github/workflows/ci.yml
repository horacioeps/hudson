name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (no Google credentials in the repo, ever — spec §6.1)
        run: |
          ! grep -rE "GOCSPX-[A-Za-z0-9_-]{10,}|BEGIN( RSA)? PRIVATE KEY" \
              --exclude-dir=.git --exclude=ci.yml .
      - run: swift --version
      - run: swift test
